<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Soma Simples</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <form id="formulario">
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    <button type="submit">Somar</button>
    <div id="resultado">
        <input type="number" id="resultado" placeholder="resultado">   
    </div>
    <div id="desconto">
      <input type="number" id="desconto" placeholder="desconto">
    </div>
    <div id="valor_com_desconto">
      <input type="number" id="valor_com_desconto" placeholder="valor com desconto">
    </div>
  </form>
  <script src="main.js">
  </script>

</body>
</html>
